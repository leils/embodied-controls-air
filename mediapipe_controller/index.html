<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MediaPipe controller</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>MediaPipe controller</h1>
      <p class="subtitle">
        Individual channels, or one slider driven by a two-hand pinch.
      </p>
    </header>

    <main>
      <section class="viewer">
        <div class="stage">
          <video id="webcam" playsinline autoplay muted></video>
          <canvas id="overlay"></canvas>
        </div>
        <div class="controls">
          <button id="toggleCamera" type="button" disabled>Start camera</button>
          <p id="status" class="status">Loading model…</p>
        </div>
        <p id="readout" class="readout">Waiting for camera…</p>
      </section>

      <section class="outputs">
        <div class="modes" role="group" aria-label="Mode">
          <button type="button" class="mode-btn active" id="modeChannels" aria-pressed="true">
            Individual channels
          </button>
          <button type="button" class="mode-btn" id="modePinch" aria-pressed="false">
            Pinch
          </button>
        </div>

        <div class="channels" id="channelPanel" aria-label="Channels">
        <label class="strength">
          Pinch clutch
          <input id="pinchClutch" type="checkbox" />
        </label>
        <div class="channel" data-channel="1">
          <div class="channel-check">
            <input type="checkbox" tabindex="-1" />
            <input class="channel-name" type="text" value="Channel 1" aria-label="Channel 1 name" maxlength="24" />
          </div>
          <input type="range" min="0" max="127" value="0" tabindex="-1" />
          <output>0</output>
        </div>
        <div class="channel" data-channel="2">
          <div class="channel-check">
            <input type="checkbox" tabindex="-1" />
            <input class="channel-name" type="text" value="Channel 2" aria-label="Channel 2 name" maxlength="24" />
          </div>
          <input type="range" min="0" max="127" value="0" tabindex="-1" />
          <output>0</output>
        </div>
        <div class="channel" data-channel="3">
          <div class="channel-check">
            <input type="checkbox" tabindex="-1" />
            <input class="channel-name" type="text" value="Channel 3" aria-label="Channel 3 name" maxlength="24" />
          </div>
          <input type="range" min="0" max="127" value="0" tabindex="-1" />
          <output>0</output>
        </div>
        <div class="channel" data-channel="4">
          <div class="channel-check">
            <input type="checkbox" tabindex="-1" />
            <input class="channel-name" type="text" value="Channel 4" aria-label="Channel 4 name" maxlength="24" />
          </div>
          <input type="range" min="0" max="127" value="0" tabindex="-1" />
          <output>0</output>
        </div>
        </div>

        <div class="channels" id="pinchPanel" hidden>
          <label class="strength">
            Two channels
            <input id="pinchMulti" type="checkbox" checked />
          </label>
          <div id="pinchSingle" hidden>
            <div class="channel" id="pinchRow">
              <div class="channel-check">
                <input class="channel-name" id="pinchName" type="text" value="Pinch" aria-label="Pinch output name" maxlength="24" />
              </div>
              <input id="pinchSlider" type="range" min="0" max="127" value="0" tabindex="-1" />
              <output id="pinchValue">0</output>
            </div>
          </div>
          <div id="pinchChannels">
            <div class="channel" data-pinch-channel="1">
              <div class="channel-check">
                <input type="checkbox" tabindex="-1" />
                <input class="channel-name" type="text" value="Channel 1" aria-label="Pinch channel 1 name" maxlength="24" />
              </div>
              <input type="range" min="0" max="127" value="0" tabindex="-1" />
              <output>0</output>
            </div>
            <div class="channel" data-pinch-channel="2">
              <div class="channel-check">
                <input type="checkbox" tabindex="-1" />
                <input class="channel-name" type="text" value="Channel 2" aria-label="Pinch channel 2 name" maxlength="24" />
              </div>
              <input type="range" min="0" max="127" value="0" tabindex="-1" />
              <output>0</output>
            </div>
          </div>
          <label class="strength">
            Strength
            <input id="pinchStrength" type="number" min="1" max="1000" step="1" value="250" />
          </label>
        </div>

        <div class="midi">
          <div class="midi-connect">
            <button id="connectMidi" type="button">Connect MIDI</button>
            <label class="midi-output">
              Output
              <select id="midiOutput" disabled>
                <option value="">No outputs</option>
              </select>
            </label>
          </div>
          <p id="midiStatus" class="status">MIDI not connected</p>
          <details class="midi-log">
            <summary>MIDI log</summary>
            <pre id="midiLog">No messages yet.</pre>
          </details>
        </div>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
